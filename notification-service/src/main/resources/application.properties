spring.application.name=notification-service
server.port=8090

#kafka consumer
spring.kafka.reminder-topic=cmp-sms
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=cmp-notification-group
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.LongDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.report-topic=cmp-doctor-reports