spring.application.name=laboratory-service
server.port=8089
#db
spring.datasource.url=jdbc:postgresql://localhost:5432/laboratory_service_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
#liquibase
spring.liquibase.change-log=classpath:db/changelog/changelog-root.yaml
#kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.lab-request-topic=cmp-lab-requests
spring.kafka.consumer.group-id=cmp-laboratory-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.LongDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer