spring.application.name=final-project
server.port=8088

#db
spring.datasource.url=jdbc:postgresql://localhost:5432/cmp_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
#liquibase
spring.liquibase.change-log=classpath:db/changelog/changelog-root.yaml
#keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8082/realms/cmp
#kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.reminder-topic=cmp-sms
spring.kafka.lab-request-topic=cmp-lab-requests
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.LongSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.report-topic=cmp-doctor-reports